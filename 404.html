<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>WelsGuessr</title>
<!-- SPA-Deep-Link-Trick (spa-github-pages): wandelt /WelsGuessr/spielen in /WelsGuessr/?/spielen
     um, damit index.html lädt und router.js die Route wiederherstellt. -->
<script>
  var pathSegmentsToKeep = 1; // Projektseite: /WelsGuessr beibehalten
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.host +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
